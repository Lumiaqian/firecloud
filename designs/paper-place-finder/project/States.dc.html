<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>纸笔控件 · 状态与反馈</title><script src="./support.js"></script></head>
<body><x-dc>
<helmet><style>
body{margin:0}*{box-sizing:border-box}
button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}input{padding:0;margin:0;caret-color:#b53826}
svg{flex-shrink:0;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid #2d5f8a;outline-offset:3px}
div:has(>input[type="search"]:focus-visible){border-color:#2d5f8a!important;box-shadow:0 0 0 3px #2d5f8a14}
div>input[type="search"]:focus{outline:none}input::placeholder{color:#776a56;opacity:1}
@media(hover:hover) and (pointer:fine){button:not([aria-pressed="true"]):hover{background-color:#eee8d9!important}}
button:not([aria-pressed="true"]):active{background-color:#e5dcc8!important}
@media(forced-colors:active){div:has(>input[type="search"]:focus-visible){outline:2px solid Highlight;outline-offset:2px}}
</style></helmet>
<main style="width:1100px;height:900px;padding:44px 52px;background:#fdfaf3;color:#36372f;font-family:'Songti SC','Noto Serif SC',SimSun,serif;">
<header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid #c7bdab;padding-bottom:24px;"><div><p style="font-family:Georgia,serif;letter-spacing:3px;color:#776a56;font-size:11px;margin:0 0 12px;">FIRECLOUD / PAPER & INK</p><h1 style="font-size:32px;font-weight:400;letter-spacing:3px;margin:0;">纸笔控件</h1></div><p style="font-size:13px;letter-spacing:2px;color:#776a56;margin:0 0 4px;">状态与反馈 · 地点篇</p></header>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:48px;row-gap:28px;margin-top:28px;">
<section style="display:flex;flex-direction:column;gap:13px;">
<h2 style="font-size:12px;font-weight:400;letter-spacing:2px;color:#776a56;margin:0;">01 / 默认与键盘聚焦</h2>
<label for="default-search" style="display:block;font-size:13px;">搜索城市</label>
<div style="border:1.5px solid #766d5e;border-radius:4px 7px 3px 5px;background:#fffcf7;display:flex;align-items:center;padding:0 16px;gap:12px;min-height:56px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6.5" stroke="#625b4e" stroke-width="1.5"/><path d="m15 15 6 6" stroke="#625b4e" stroke-width="1.5"/></svg><input id="default-search" type="search" placeholder="搜索城市…" style="width:100%;min-width:0;height:48px;font-size:16px;line-height:1.5;color:#36372f;background:none;border:0;"></div>
<label for="focused-search" style="font-size:13px;">键盘聚焦</label>
<div style="border:1.5px solid #2d5f8a;box-shadow:0 0 0 3px #2d5f8a14;border-radius:4px 7px 3px 5px;background:#fffcf7;display:flex;align-items:center;padding:0 16px;gap:12px;min-height:56px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6.5" stroke="#625b4e" stroke-width="1.5"/><path d="m15 15 6 6" stroke="#625b4e" stroke-width="1.5"/></svg><input id="focused-search" type="search" placeholder="搜索城市…" style="width:100%;min-width:0;height:48px;font-size:16px;line-height:1.5;color:#36372f;background:none;border:0;"></div>
</section>
<section style="display:flex;flex-direction:column;gap:13px;">
<h2 style="font-size:12px;font-weight:400;letter-spacing:2px;color:#776a56;margin:0;">02 / 正在搜索</h2>
<label for="loading-search" style="font-size:13px;">搜索城市</label>
<div style="border:1.5px solid #766d5e;border-radius:4px 7px 3px 5px;background:#fffcf7;display:flex;align-items:center;padding:0 16px;gap:12px;min-height:56px;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="6.5" stroke="#625b4e" stroke-width="1.5"/><path d="m15 15 6 6" stroke="#625b4e" stroke-width="1.5"/></svg><input id="loading-search" type="search" value="杭州" readonly="readonly" aria-busy="true" style="flex:1;min-width:0;height:48px;font-size:16px;line-height:1.5;color:#36372f;background:none;border:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-5.5-7.6" stroke="#b53826" stroke-width="1.5"/></svg></div>
<p style="margin:0;font-size:13px;color:#776a56;line-height:1.7;">正在搜索…</p>
<div style="display:flex;align-items:center;gap:14px;margin-top:10px;color:#776a56;"><span aria-hidden="true" style="height:1px;background:#d4cbbb;flex:1;"></span><span style="font-size:12px;letter-spacing:2px;">收藏地点仍然可用</span><span aria-hidden="true" style="height:1px;background:#d4cbbb;flex:1;"></span></div>
</section>
<section style="display:flex;flex-direction:column;gap:13px;">
<h2 style="font-size:12px;font-weight:400;letter-spacing:2px;color:#776a56;margin:0;">03 / 未寻得城市</h2>
<div style="padding:22px 24px;border:1px dashed #b9ae99;border-radius:4px 7px 3px 5px;min-height:136px;display:flex;align-items:flex-start;gap:18px;"><svg width="30" height="32" viewBox="0 0 32 32" fill="none" aria-hidden="true" style="flex-shrink:0;"><circle cx="12" cy="12" r="8" stroke="#776a56" stroke-width="1.2"/><path d="m18 18 10 10M8 12h8" stroke="#776a56" stroke-width="1.3" stroke-linecap="round"/></svg><div><h3 style="font-size:18px;font-weight:400;margin:0 0 10px;">未寻得匹配城市</h3><p style="font-size:13px;line-height:1.8;color:#6b6255;margin:0;">试试输入省市全称，<br>或使用设备定位。</p></div></div>
</section>
<section style="display:flex;flex-direction:column;gap:13px;">
<h2 style="font-size:12px;font-weight:400;letter-spacing:2px;color:#776a56;margin:0;">04 / 网络未通</h2>
<div style="padding:22px 24px;border:1px solid #c9ae9d;border-radius:4px 7px 3px 5px;min-height:136px;background:#f6eee4;display:flex;align-items:flex-start;gap:18px;"><svg width="28" height="30" viewBox="0 0 28 30" fill="none" aria-hidden="true" style="flex-shrink:0;"><path d="M14 3 26 25H2L14 3Z" stroke="#9a3926" stroke-width="1.2" stroke-linejoin="round"/><path d="M14 10v7m0 4v1" stroke="#9a3926" stroke-width="1.7" stroke-linecap="round"/></svg><div><h3 style="font-size:18px;font-weight:400;margin:0 0 10px;color:#9a3926;">城市检索网络未通</h3><p style="font-size:13px;line-height:1.8;color:#6b6255;margin:0;">请稍后重试。<br>也可以选择已收藏的地点。</p></div></div>
</section>
<section style="display:flex;flex-direction:column;gap:13px;">
<h2 style="font-size:12px;font-weight:400;letter-spacing:2px;color:#776a56;margin:0;">05 / 暂无收藏</h2>
<div style="display:flex;align-items:center;gap:18px;padding:20px 0;min-height:105px;"><svg width="38" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="m20 5 5 10 11 1-8 8 2 11-10-5-10 5 2-11-8-8 11-1Z" stroke="#8f4006" stroke-width="1.2" stroke-linejoin="round"/></svg><div><h3 style="font-size:18px;font-weight:400;margin:0 0 9px;">留住想看的天空</h3><p style="font-size:13px;line-height:1.8;color:#6b6255;margin:0;">暂无收藏地点，<br>点击手记卡片右上角星标即可珍藏。</p></div></div>
</section>
<section style="display:flex;flex-direction:column;gap:13px;">
<h2 style="font-size:12px;font-weight:400;letter-spacing:2px;color:#776a56;margin:0;">06 / 移出后可撤销</h2>
<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#eee8d9;border:1px solid #c7bdab;border-radius:4px 7px 3px 5px;min-height:66px;"><p style="font-size:14px;margin:0;">已移出收藏「厦门」</p><button type="button" style="min-width:56px;min-height:44px;background:transparent;border:0;color:#9a3926;text-decoration:underline;text-underline-offset:5px;font-size:14px;">撤销</button></div>
<div style="display:flex;align-items:center;gap:8px;color:#6b6255;font-size:12px;line-height:1.7;"><span>移出收藏不改变当前观测地点。</span></div>
</section>
</div>
<footer style="margin-top:28px;padding-top:22px;border-top:1px solid #c7bdab;display:flex;align-items:center;justify-content:space-between;gap:20px;">
<div style="display:flex;gap:16px;align-items:center;"><span style="font-size:12px;color:#776a56;letter-spacing:2px;">晨昏切换</span><div role="group" aria-label="晨昏时段" style="display:flex;padding:3px;border:1.3px solid #766d5e;border-radius:5px 3px 6px 4px;"><button type="button" aria-pressed="false" style="min-height:44px;min-width:80px;background:transparent;color:#625b4e;border:0;">朝霞</button><button type="button" aria-pressed="true" style="position:relative;min-height:44px;min-width:80px;background:#e8d4b4;color:#703917;border:0;border-radius:3px 5px 2px 4px;">晚霞<svg width="46" height="6" viewBox="0 0 46 6" fill="none" aria-hidden="true" style="position:absolute;bottom:4px;left:17px;"><path d="M2 3Q21 1 44 3" stroke="#9a3926" stroke-width="1.3" stroke-linecap="round"/></svg></button></div></div>
<div style="display:flex;gap:24px;font-size:12px;color:#6b6255;"><span>和纸</span><span style="color:#36372f;">墨线</span><span style="color:#b53826;">朱砂</span><span style="color:#2d5f8a;">焦点蓝</span></div>
</footer>
</main>
</x-dc>
