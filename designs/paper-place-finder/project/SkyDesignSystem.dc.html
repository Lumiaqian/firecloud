<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天空画笺 · 设计系统</title><script src="./support.js"></script><link rel="stylesheet" href="ds/sky-letter/tokens.css"><link rel="stylesheet" href="ds/sky-letter/components/bundle.css"></head>
<body><x-dc><helmet><style>
body{margin:0}.system-sheet{min-height:1160px;padding:48px 6%;background:linear-gradient(180deg,var(--sky-top),var(--sky-mid) 49%,var(--sky-bottom));color:var(--sky-ink)}.system-wrap{max-width:1100px;margin:auto}.system-head{display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}.system-brand{display:flex;align-items:center;gap:12px}.system-brand img{width:43px;height:43px}.system-brand p{font-size:12px}.system-theme{display:flex;gap:8px;flex-wrap:wrap;padding:4px 12px}.system-theme [aria-pressed=true]{color:var(--ink-selected);background:url('/_blob/ca21bc89b8a03234da940fcb9db94854') center bottom/75% 8px no-repeat}.system-heading{margin:54px 0 30px}.system-heading h1{font-size:46px;line-height:1.2}.system-heading p{font-size:16px;margin-top:12px}.system-controls{padding:28px 36px;margin:30px 0 0 auto;max-width:720px}.system-controls h2{font-size:24px}.system-controls p{font-size:15px;margin-top:12px}.system-actions{display:flex;align-items:center;gap:20px;margin-top:14px}.system-footer{font-size:13px;margin-top:28px}.system-sheet .sl-fc-paper-pair{max-width:none}.system-sheet .sl-fc-score-heading{color:var(--ink-muted)}@media(max-width:700px){.system-sheet{padding:28px 22px}.system-heading{margin-top:32px}.system-heading h1{font-size:34px}.system-controls{padding:25px}.system-theme{gap:0}}
</style></helmet>
<main class="sl-preview system-sheet" data-theme="{{theme}}"><div class="system-wrap">
<header class="system-head"><div class="system-brand"><img src="/_blob/85712d98fe5c97592b888ef332c464b3" alt=""><div><span class="sl-heading22">霞光预报</span><p>天空画笺 · 设计系统</p></div></div><nav class="system-theme sl-paper" aria-label="环境主题"><button class="sl-action" aria-pressed="{{dusk}}" onClick="{{setDusk}}">暮色</button><button class="sl-action" aria-pressed="{{day}}" onClick="{{setDay}}">白昼</button><button class="sl-action" aria-pressed="{{dawn}}" onClick="{{setDawn}}">破晓</button><button class="sl-action" aria-pressed="{{night}}" onClick="{{setNight}}">夜色</button></nav></header>
<div class="system-heading"><h1>天空画笺</h1><p>圈注判断，旁批依据。全文小赖。</p></div>
<section class="sl-forecast-family" aria-label="已采用卡片组合 · 非实时样例"><div class="sl-fc-paper-pair"><article class="sl-paper sl-fc-score-note" aria-labelledby="score-label"><img class="sl-fc-score-ink" src="/_blob/a3a5f3b700b02619f6dafa51f92ed274" alt=""><p class="sl-fc-score-heading">晨昏观测手记</p><p id="score-label" class="sl-body14 sl-muted">霞光指数 0–99</p><div class="sl-fc-score-line"><strong class="sl-fc-score">77</strong></div><h2 class="sl-fc-grade">值得追</h2><p class="sl-fc-advice">中高云与地平光路条件较有利，可留意天际色彩变化</p></article><aside class="sl-paper sl-fc-event-note" aria-label="日落观赏窗口"><span class="sl-body14 sl-muted">日落</span><p class="sl-fc-event-time">17:12</p><p>霞光观赏中</p><p class="sl-fc-azimuth">西南 254° · UTC+8</p><div class="sl-fc-window sl-fc-rule"><span class="sl-body14 sl-muted">观赏窗口</span><p class="sl-fc-window-range">16:57–17:37</p><p class="sl-fc-peak">余晖峰值 17:22</p></div></aside></div></section>
<section class="sl-paper system-controls"><h2>纸笔的分寸</h2><p>纸面留净，不围框；圈线强调分数，引线关联判断。</p><p>天气批注分云层与空气两组；七日是一张无折痕横笺。当前划线，最高圈注。</p><div class="system-actions"><button class="sl-action" aria-pressed="{{saved}}" onClick="{{toggleSaved}}">{{saveLabel}}</button><span class="sl-caption12 sl-muted">Tab 查看独立焦点</span></div></section>
<footer class="system-footer">非实时样例 · 昼夜只调纸色，所选日期不改变实况天气与月相。</footer>
</div></main></x-dc><script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dusk","day","dawn","night"],"default":"dusk"},"$preview":{"width":1280,"height":1280}}'>
class Component extends DCLogic {
renderVals(){const theme=this.state.theme??this.props.theme??'dusk';const saved=this.state.saved===true;return {theme,dusk:theme==='dusk',day:theme==='day',dawn:theme==='dawn',night:theme==='night',saved,saveLabel:saved?'已收藏 · 点击取消':'收藏这片天空',setDusk:()=>this.setState({theme:'dusk'}),setDay:()=>this.setState({theme:'day'}),setDawn:()=>this.setState({theme:'dawn'}),setNight:()=>this.setState({theme:'night'}),toggleSaved:()=>this.setState({saved:!saved})};}
}
</script></body></html>
