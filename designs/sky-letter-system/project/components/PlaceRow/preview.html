<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>地点行 · 非实时样例</title></head>
<body class="sl-preview"><main class="sl-demo"><section class="sl-paper sl-control-paper" aria-labelledby="places-title">
<p class="sl-control-eyebrow">地点与收藏 · 非实时样例</p><h1 class="sl-control-heading" id="places-title">想看的天空</h1><p class="sl-control-help">点地名切换，点星标只改收藏。选中地点以文字与细下划线标记，不铺色块。</p>
<ul class="sl-place-list" aria-label="本地地点，地名用于切换，星标用于收藏">
<li class="sl-place-row" data-city="杭州"><button class="sl-ink-button sl-place-pick" type="button" aria-current="location"><span class="sl-place-number" aria-hidden="true">01</span><span class="sl-place-copy"><strong>杭州</strong><small>浙江省 · 非实时样例</small></span><span class="sl-place-current">当前</span></button><button class="sl-ink-button sl-icon-button sl-place-star" type="button" aria-label="取消收藏杭州" aria-pressed="true"><svg class="sl-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z"></path></svg></button></li>
<li class="sl-place-row" data-city="宁波"><button class="sl-ink-button sl-place-pick" type="button"><span class="sl-place-number" aria-hidden="true">02</span><span class="sl-place-copy"><strong>宁波</strong><small>浙江省 · 非实时样例</small></span><span class="sl-place-current" hidden>当前</span></button><button class="sl-ink-button sl-icon-button sl-place-star" type="button" aria-label="收藏宁波" aria-pressed="false"><svg class="sl-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z"></path></svg></button></li>
<li class="sl-place-row" data-city="上海"><button class="sl-ink-button sl-place-pick" type="button"><span class="sl-place-number" aria-hidden="true">03</span><span class="sl-place-copy"><strong>上海</strong><small>上海市 · 非实时样例</small></span><span class="sl-place-current" hidden>当前</span></button><button class="sl-ink-button sl-icon-button sl-place-star" type="button" aria-label="取消收藏上海" aria-pressed="true"><svg class="sl-control-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z"></path></svg></button></li>
</ul><p class="sl-control-feedback" role="status" id="place-feedback">当前：杭州 · 已收藏 2 / 3 处。仅本页临时状态。</p><p class="sl-control-help">取消收藏后保留样例行以便重新切换；不会改变当前地点，不读取天气、不写入存储。</p>
</section></main><script>window.SkyLetter.PlaceRow(document);</script></body></html>
