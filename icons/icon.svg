<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- 徽章裁切区 (226px 半径圆) -->
    <clipPath id="emblem-clip">
      <circle cx="256" cy="256" r="226"/>
    </clipPath>

    <!-- 暮色晚霞天幕渐变 (Zenith Twilight Sky) -->
    <linearGradient id="twilight-sky" x1="256" y1="30" x2="256" y2="482" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16132b"/>
      <stop offset="32%" stop-color="#441f43"/>
      <stop offset="58%" stop-color="#8d3251"/>
      <stop offset="80%" stop-color="#e05b39"/>
      <stop offset="100%" stop-color="#fba84d"/>
    </linearGradient>

    <!-- 霞日微晕轮漫射 (Sun Atmospheric Halo) -->
    <radialGradient id="sun-halo" cx="256" cy="268" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffd56b" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#f87147" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#8d3251" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#16132b" stop-opacity="0"/>
    </radialGradient>

    <!-- 霞日本体 (Sun Core) -->
    <radialGradient id="sun-core" cx="256" cy="268" r="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="36%" stop-color="#ffea9f"/>
      <stop offset="75%" stop-color="#ff9a35"/>
      <stop offset="100%" stop-color="#e8590c"/>
    </radialGradient>

    <!-- 复古黄铜金属外圈渐变 (Antique Brass Rim) -->
    <linearGradient id="brass-rim" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fcf0d5"/>
      <stop offset="26%" stop-color="#c99c58"/>
      <stop offset="52%" stop-color="#fcf0cb"/>
      <stop offset="76%" stop-color="#885e25"/>
      <stop offset="100%" stop-color="#dfbc82"/>
    </linearGradient>

    <!-- 远景紫粉霞云渐变 -->
    <linearGradient id="cloud-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f79872"/>
      <stop offset="100%" stop-color="#552044"/>
    </linearGradient>

    <!-- 近景火烧云渐变 -->
    <linearGradient id="cloud-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb885"/>
      <stop offset="38%" stop-color="#be4454"/>
      <stop offset="100%" stop-color="#281330"/>
    </linearGradient>

    <!-- 凸透镜弧面高光渐变 -->
    <linearGradient id="lens-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 徽章核心天象内容区 (Clipped to Circle, Transparent Outside) -->
  <g clip-path="url(#emblem-clip)">
    <!-- 晚霞天幕 -->
    <rect x="25" y="25" width="462" height="462" fill="url(#twilight-sky)"/>

    <!-- 放射霞光金线 (Antique Astronomical Ray Lines) -->
    <g opacity="0.38" stroke="#ffebc2" stroke-width="2.5" stroke-dasharray="3 6">
      <line x1="256" y1="268" x2="256" y2="40"/>
      <line x1="256" y1="268" x2="90" y2="102"/>
      <line x1="256" y1="268" x2="422" y2="102"/>
      <line x1="256" y1="268" x2="42" y2="222"/>
      <line x1="256" y1="268" x2="470" y2="222"/>
      <line x1="256" y1="268" x2="150" y2="52"/>
      <line x1="256" y1="268" x2="362" y2="52"/>
    </g>

    <!-- 太阳微晕轮 -->
    <circle cx="256" cy="268" r="180" fill="url(#sun-halo)"/>

    <!-- 霞日金乌 -->
    <circle cx="256" cy="268" r="72" fill="url(#sun-core)"/>

    <!-- 暮星天象闪烁 (Evening Star) -->
    <g transform="translate(382, 108)" opacity="0.92">
      <path d="M0 -34 L7 -7 L34 0 L7 7 L0 34 L-7 7 L-34 0 L-7 -7 Z" fill="#fff7db"/>
      <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    </g>
    <circle cx="114" cy="142" r="7" fill="#ffeec2" opacity="0.75"/>
    <circle cx="400" cy="178" r="4.5" fill="#ffd9a6" opacity="0.65"/>

    <!-- 远景紫粉霞云 (Back Cloud Silhouette) -->
    <path d="M25 344 C76 300, 138 310, 186 332 C228 298, 292 298, 328 318 C376 288, 436 298, 487 332 L487 482 L25 482 Z" fill="url(#cloud-back)" opacity="0.92"/>
    <path d="M25 344 C76 300, 138 310, 186 332 C228 298, 292 298, 328 318 C376 288, 436 298, 487 332" stroke="#ffc993" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>

    <!-- 近景火烧云与金边 (Front Sunset Clouds) -->
    <path d="M15 384 C65 350, 120 356, 169 378 C217 344, 288 350, 324 370 C372 352, 432 364, 497 401 L497 482 L15 482 Z" fill="url(#cloud-front)"/>
    <path d="M15 384 C65 350, 120 356, 169 378 C217 344, 288 350, 324 370 C372 352, 432 364, 497 401" stroke="#ffe2ba" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.92"/>

    <!-- 手札天文弧形经纬刻度 (Astronomical Horizon Arc) -->
    <ellipse cx="256" cy="442" rx="206" ry="66" fill="none" stroke="rgba(255, 235, 205, 0.32)" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- 弧面凸透镜复古光泽 (Convex Lens Specular Gloss) -->
    <path d="M52 198 C78 106, 156 52, 250 52 C286 52, 322 64, 358 76 C264 100, 150 160, 90 256 C68 234, 56 214, 52 198 Z" fill="url(#lens-gloss)" opacity="0.24"/>
  </g>

  <!-- 复古黄铜双圈外框 (Vintage Brass Double Ring - 无任何多余外部方底) -->
  <circle cx="256" cy="256" r="238" stroke="url(#brass-rim)" stroke-width="24" fill="none"/>
  <!-- 内层高光细圈与点状罗盘刻度 -->
  <circle cx="256" cy="256" r="226" stroke="rgba(255, 245, 220, 0.6)" stroke-width="3" stroke-dasharray="10 5" fill="none"/>
  <circle cx="256" cy="256" r="250" stroke="rgba(140, 98, 41, 0.55)" stroke-width="2" fill="none"/>
</svg>
